<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sae-Young Chung</title>
    <style>
        /* Base page reset and web-safe typography */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 15px;
            line-height: 1.6;
            color: #222222;
            background-color: #ffffff;
            padding: 0;
            margin: 0;
        }

        /* Centered page container */
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 20px 40px 20px;
        }

        /* Top Navigation Bar */
        nav {
            border-bottom: 1px solid #e0e0e0;
            padding: 15px 0;
            margin-bottom: 30px;
        }

        nav .nav-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
        }

        nav .site-title {
            font-size: 18px;
            font-weight: 600;
            color: #111111;
            text-decoration: none;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 20px;
            margin: 0;
            padding: 0;
        }

        nav ul li a {
            color: #0066cc;
            text-decoration: none;
            font-size: 15px;
        }

        nav ul li a.active {
            font-weight: 600;
            color: #111111;
        }

        nav ul li a:hover {
            text-decoration: underline;
        }

        /* Page Title */
        h1.page-title {
            font-size: 26px;
            font-weight: 700;
            color: #111111;
            margin-bottom: 10px;
        }

        p.subtitle {
            color: #555555;
            margin-bottom: 25px;
        }

        /* Letter Container Styling */
        .letter-content {
            background-color: #fdfdfd;
            border: 1px solid #e5e5e5;
            border-radius: 4px;
            padding: 30px;
            margin-top: 20px;
        }

        /* Plain text element styling inside letter */
        .plain-text-body {
            font-family: inherit;
            font-size: 15px;
            line-height: 1.8;
            color: #333333;
            white-space: pre-wrap;
            margin: 0;
        }

        /* Footer */
        footer {
            margin-top: 40px;
            padding-top: 15px;
            border-top: 1px solid #eeeeee;
            font-size: 13px;
            color: #777777;
        }

        /* Responsive Mobile Layout */
        @media (max-width: 600px) {
            nav .nav-container {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>

    <!-- Top Navigation -->
    <nav>
        <div class="nav-container">
            <a href="index.html" class="site-title">Sae-Young Chung</a>
            <ul>
                <li><a href="index.html" class="active">Home</a></li>
                <li><a href="bio.html">Biography</a></li>
                <li><a href="publications.html">Publications</a></li>
                <li><a href="itml.html">ITML Group</a></li>
            </ul>
        </div>
    </nav>

    <!-- Main Content Container -->
    <div class="container">

    </div>

</body>
</html>
